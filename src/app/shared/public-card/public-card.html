
<article
  class="aa-match-card"
  [class.is-compact]="compact"
  [class.has-placeholder]="!hasPhoto"
>

  <!-- MOBILE CARD LINK -->
  <a
    class="aa-mobile-card-link"
    [routerLink]="['/free-profile', profile.code]"
    [queryParams]="returnState
      ? { s: returnState, source: searchRoute }
      : null"
    (click)="rememberSearchPosition()"
    [attr.aria-label]="
      t('View profile for ', 'சுயவிவரத்தைக் காண்க ') + displayName
    "
  ></a>

  <!-- PROFILE PHOTO AREA -->
  <div
    class="aa-match-photo"
    [class.aa-has-real-photo]="hasPhoto"
    [class.aa-using-avatar]="!hasPhoto"
  >

    @if (showImage) {

      @if (hasPhoto) {

        <!-- REAL PHOTO: FULL CARD -->
        <img
          class="aa-real-photo"
          [src]="displayPhoto"
          [alt]="displayName"
          (error)="onPhotoError($event)"
          loading="lazy"
          decoding="async"
        />

      } @else {

        <!-- DEFAULT AVATAR: SMALL CIRCLE -->
        <div class="aa-avatar-holder">
          <img
            class="aa-avatar-image"
            [src]="displayPhoto"
            [alt]="displayName"
            (error)="onPhotoError($event)"
            loading="lazy"
            decoding="async"
          />
        </div>

        <span class="aa-avatar-brand">
          ASTRO ALLIANCE
        </span>

      }

    } @else {

      <!-- FALLBACK INITIALS -->
      <div class="aa-avatar-holder aa-avatar-initials">
        {{ initials }}
      </div>

      <span class="aa-avatar-brand">
        ASTRO ALLIANCE
      </span>

    }

      
      <span class="profile-code-badge">
  {{ profile.code }}
</span>
    

  </div>

  <!-- MEMBER DETAILS -->
  <div class="aa-member-details">

    <div class="aa-member-heading">

      <h3 class="aa-member-name">
        {{ displayName }}
      </h3>

      @if (
        profile.age !== null &&
        profile.age !== undefined
      ) {
        <span class="aa-member-age">
          {{ profile.age }}
          {{ t('Years', 'வயது') }}
        </span>
      }

    </div>

    <!-- VIEW PROFILE BUTTON -->
    <div class="aa-match-actions">

      <a
        class="aa-view-profile"
        [routerLink]="['/free-profile', profile.code]"
        [queryParams]="returnState
          ? { s: returnState, source: searchRoute }
          : null"
        (click)="rememberSearchPosition()"
        [attr.aria-label]="
          t(
            'View basic profile for ',
            'அடிப்படை சுயவிவரத்தைப் பார்க்க '
          ) + displayName
        "
      >
        <span>
          {{ t('View Profile', 'சுயவிவரத்தைக் காண்க') }}
        </span>

        <span class="aa-view-arrow" aria-hidden="true">
          ↗
        </span>
      </a>

    </div>

  </div>

</article>
