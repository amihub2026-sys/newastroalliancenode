<article
  class="aa-match-card"
  [class.is-compact]="compact"
  [class.has-placeholder]="!hasPhoto"
>
  <!-- Mobile: whole card is clickable -->
  <a
    class="aa-mobile-card-link"
    [routerLink]="['/free-profile', profile.code]"
    [queryParams]="returnState
      ? { s: returnState, source: searchRoute }
      : null"
    (click)="rememberSearchPosition()"
    [attr.aria-label]="
      t('View profile for ', 'சுயவிவரத்தைக் காண்க ') + displayName
    "
  ></a>


  <div class="aa-match-photo">
@if (hasPhoto) {
  <img
    [src]="photo"
    [alt]="t('Profile photo for ', 'சுயவிவரப் படம் ') + displayName"
    (error)="onPhotoError($event)"
    loading="lazy"
    decoding="async"
  />
} @else {
    
      <div class="aa-photo-placeholder" aria-hidden="true">
        <div class="aa-placeholder-orbit"></div>
        <div class="aa-placeholder-monogram">
          {{ initials }}
        </div>
        <span class="aa-placeholder-brand">ASTRO ALLIANCE</span>
      </div>
    }

    <span class="aa-approved">
      <span class="aa-approved-icon" aria-hidden="true">✓</span>
      {{ t('Approved', 'அங்கீகரிக்கப்பட்டது') }}
    </span>

  </div>

  <div class="aa-member-details">

    <div class="aa-member-heading">
      <h3 class="aa-member-name">{{ displayName }}</h3>

      @if (profile.age !== null && profile.age !== undefined) {
        <span class="aa-member-age">
          {{ profile.age }} {{ t('Years', 'வயது') }}
        </span>
      }
    </div>

    <div class="aa-match-actions">
      <a
        class="aa-view-profile"
        [routerLink]="['/free-profile', profile.code]"
        [queryParams]="returnState ? { s: returnState, source: searchRoute } : null"
        (click)="rememberSearchPosition()"
        [attr.aria-label]="t('View basic profile for ', 'அடிப்படை சுயவிவரத்தைப் பார்க்க ') + displayName"
      >
        <span>{{ t('View Profile', 'சுயவிவரத்தைக் காண்க') }}</span>
        <span class="aa-view-arrow" aria-hidden="true">↗</span>
      </a>
    </div>

  </div>

</article>
