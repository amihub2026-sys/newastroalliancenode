
<div
  *ngIf="visible"
  class="snackbar show"
  [ngClass]="type"
>
  <!-- STATUS INDICATOR -->

  <div class="snackbar-indicator"></div>

  <!-- NOTIFICATION BODY -->

  <div class="snackbar-body">

    <!-- STATUS ICON -->

    <div class="snack-icon" aria-hidden="true">
      {{ notificationIcon }}
    </div>

    <!-- NOTIFICATION CONTENT -->

    <div
      class="snackbar-content"
      [attr.role]="type === 'error' ? 'alert' : 'status'"
    >

      <h4 *ngIf="title" class="snackbar-title">
        {{ title }}
      </h4>

      <p class="snackbar-message">
        {{ message }}
      </p>

      <span class="snackbar-brand">
        ASTRO ALLIANCE MATRIMONY
      </span>

    </div>

    <!-- MANUAL CLOSE BUTTON -->

    <button
      type="button"
      class="snackbar-close"
      aria-label="Close notification / அறிவிப்பை மூடு"
      title="Close"
      (click)="close()"
    >
      &times;
    </button>

  </div>

</div>
