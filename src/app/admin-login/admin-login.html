<section class="login-page">
  <div class="form-card">
    <p class="form-mini-title">Admin Panel</p>
    <h2>Admin Login</h2>
    <p class="form-subtitle">Only authorized admins can access this page</p>

<form
  class="login-form"
  (ngSubmit)="onAdminLogin()"
  autocomplete="on"
>
      <div class="form-group">
        <label for="admin-email">Admin Email</label>

<input
  id="admin-email"
  type="email"
  name="username"
  [(ngModel)]="email"
  autocomplete="username"
  required
  placeholder="Enter admin email"
/>
      </div>

      <div class="form-group">
        <label for="admin-password">Password</label>

<input
  id="admin-password"
  type="password"
  name="password"
  [(ngModel)]="password"
  autocomplete="current-password"
  required
  placeholder="Enter password"
/>
      </div>

     <button type="submit" class="login-btn" [disabled]="isLoading">
        {{ isLoading ? 'Checking...' : 'Admin Login' }}
      </button>
      <p class="auth-error" role="alert" *ngIf="errorMessage">{{ errorMessage }}</p>
    </form>
  </div>
</section>
